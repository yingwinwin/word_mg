version: '3.8'

services:
  db:
    image: postgres:15
    container_name: word-manager-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: word_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: